<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication — BIGKNOWLEDGE Founder OS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div class="glass-card" style="max-width: 460px; width: 100%;">
    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-3"><i class="fa-solid fa-brain"></i></div>
      <h3 class="fw-bold mb-1">BIGKNOWLEDGE</h3>
      <p class="small text-secondary mb-0">Your Second Brain for Startups, Problems, Solutions & Execution</p>
    </div>

    <ul class="nav nav-pills nav-fill mb-3 bg-dark p-1 rounded-3" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-login">Login</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-signup">Sign Up</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-reset">Reset</button></li>
    </ul>

    <div class="tab-content">
      <!-- Login Form -->
      <div class="tab-pane fade show active" id="tab-login">
        <form onsubmit="event.preventDefault(); window.location.href='/';">
          <div class="mb-3">
            <label class="small text-secondary">Founder Email</label>
            <input type="email" class="form-control" value="founder@bigknowledge.io" required>
          </div>
          <div class="mb-3">
            <label class="small text-secondary">Password</label>
            <input type="password" class="form-control" value="••••••••••••" required>
          </div>
          <button type="submit" class="btn-brand w-100 mb-3">Sign In with JWT Security</button>
          <a href="/" class="btn btn-outline-light w-100 btn-sm py-2">
            <i class="fa-brands fa-google text-danger me-2"></i>Continue with Google OAuth
          </a>
        </form>
      </div>

      <!-- Signup Form -->
      <div class="tab-pane fade" id="tab-signup">
        <form onsubmit="event.preventDefault(); window.location.href='/';">
          <div class="mb-2"><label class="small text-secondary">Full Name</label><input type="text" class="form-control" placeholder="Vijay Dakeni" required></div>
          <div class="mb-2"><label class="small text-secondary">Email</label><input type="email" class="form-control" placeholder="founder@startup.io" required></div>
          <div class="mb-2"><label class="small text-secondary">Role</label><select class="form-select"><option>Founder</option><option>Co-Founder</option><option>Developer</option><option>Researcher</option></select></div>
          <div class="mb-3"><label class="small text-secondary">Password</label><input type="password" class="form-control" required></div>
          <button type="submit" class="btn-brand w-100">Create Founder OS Account</button>
        </form>
      </div>

      <!-- Forgot Password -->
      <div class="tab-pane fade" id="tab-reset">
        <form onsubmit="event.preventDefault(); alert('Verification link dispatched!');">
          <div class="mb-3"><label class="small text-secondary">Registered Email</label><input type="email" class="form-control" required></div>
          <button type="submit" class="btn-brand w-100">Send Password Reset Link</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
